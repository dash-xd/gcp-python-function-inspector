[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-python-function-inspector"
version = "0.1.0"
description = "Runtime/environment introspection routes for a GCP Cloud Function - deployable standalone (main.py) or served via dash-xd/pyspace-minimal's router action."
requires-python = ">=3.11"
dependencies = [
    "flask",
    "pyspace-minimal @ git+https://github.com/dash-xd/pyspace-minimal.git@claude/flask-cloud-function-template-r9sbs9",
]

[tool.setuptools.packages.find]
include = ["gcp_python_function_inspector*"]
